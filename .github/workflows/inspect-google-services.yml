name: Inspect & Download google-services.json
on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate google-services.json from secret (auto-detect)
        id: write
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          mkdir -p app
          CONTENT="$GOOGLE_SERVICES_JSON"

          # 1) هل السر JSON خام؟
          if echo "$CONTENT" | jq . >/dev/null 2>&1; then
            printf '%s' "$CONTENT" > app/google-services.json
            echo "mode=json" >> "$GITHUB_OUTPUT"
          else
            # 2) جرّب Base64 (مع تنظيف الأسطر والمسافات)
            CLEAN=$(echo "$CONTENT" | tr -d '\r\n ')
            if echo "$CLEAN" | base64 -d > app/google-services.json 2>/dev/null; then
              echo "mode=base64" >> "$GITHUB_OUTPUT"
            else
              echo "Secret GOOGLE_SERVICES_JSON is neither valid JSON nor valid Base64. Please re-save it." >&2
              exit 1
            fi
          fi

          echo "== storage_bucket ==" && jq -r '.project_info.storage_bucket' app/google-services.json || true
          echo "== package names ==" && jq -r '.client[].client_info.android_client_info.package_name' app/google-services.json || true

      - name: Upload google-services.json (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: google-services.json
          path: app/google-services.json
          retention-days: 1
